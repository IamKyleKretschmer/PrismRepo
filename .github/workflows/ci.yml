name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TodoApi.slnx

      - name: Build
        run: dotnet build TodoApi.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/TodoApi.UnitTests --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Acceptance tests
        run: dotnet test tests/TodoApi.AcceptanceTests --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Publish service package
        run: dotnet publish src/TodoApi --configuration Release --no-build --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: todo-api
          path: publish/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
